# GitHub Actions: 构建 Windows 版 + 发布 Release
# 两次推送触发：
#   - push to main           → 只上传 Artifact（快速测试用）
#   - push tag v*            → 构建 + 自动创建 GitHub Release

name: 构建 Windows 版 InvoVault

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: 构建 Windows 可执行程序
        run: |
          python -m PyInstaller fapiaobao_win.spec

      - name: 打包为 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/InvoVault/* -DestinationPath InvoVault-Windows.zip

      # main 分支推送 → 上传 Artifact（测试用途）
      - name: 上传构建产物 (Artifact)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: InvoVault-Windows
          path: InvoVault-Windows.zip

      # Tag 推送 (v*) → 创建 GitHub Release
      - name: 创建 Release
        id: create_release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: InvoVault ${{ github.ref_name }}
          body: |
            ## InvoVault ${{ github.ref_name }}

            ### 📦 下载
            - **Windows**: InvoVault-Windows.zip（解压即用，无需安装）

            ### ✨ 更新说明
            $(if "${{ github.event.head_commit.message }}" -ne "") { "本次提交: ${{ github.event.head_commit.message }}" } else { "请查看 Git 提交历史了解变更。" }

            ### ⚠️ 使用说明
            1. 解压 ZIP 后运行 `InvoVault.exe`
            2. 选择含发票 PDF/OFD 的文件夹
            3. 选择纳税人类型 → 开始提取
            4. 双击行可预览发票
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: InvoVault-Windows.zip

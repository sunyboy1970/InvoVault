name: 构建 Windows 版 InvoVault

on:
  push:
    branches: [ "main" ]
    # 或手动触发（GitHub 网页上点 "Run workflow"）
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller
          pip install -r requirements.txt

      - name: 用 PyInstaller 打包
        run: |
          python -m PyInstaller fapiaobao_win.spec

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: InvoVault-Windows
          path: dist/InvoVault/
